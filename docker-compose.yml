services:
 mediamtx:
   image: bluenviron/mediamtx:latest
   container_name: lab-camera-mediamtx
   restart: unless-stopped
   ports:
     - "8554:8554"
     - "8888:8888"
     - "8889:8889"
     - "8189:8189/udp"
   volumes:
     - ./infrastructure/mediamtx/mediamtx.yml:/mediamtx.yml:ro
 postgres:
   image: postgres:16
   container_name: lab-camera-postgres
   restart: unless-stopped
   environment:
     POSTGRES_USER: labcamera
     POSTGRES_PASSWORD: labcamera_dev_password
     POSTGRES_DB: labcamera
   ports:
     - "5433:5432"
   volumes:
     - postgres_data:/var/lib/postgresql/data
volumes:
 postgres_data: